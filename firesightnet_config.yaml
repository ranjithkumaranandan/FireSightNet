# FireSightNet Configuration
# Paper: Expert Systems with Applications

model:
  backbone: efficientnet_b4
  pretrained: true
  num_classes: 4
  transformer_heads: 8
  transformer_dim: 1792
  cbam: true
  fpn: true
  triple_pooling: true        # GeM + GAP + GMP -> 768-d
  gem_p: 3.0                  # GeM pooling parameter
  dropout1: 0.4
  dropout2: 0.3
  fc1_dim: 512
  fc2_dim: 256

dataset:
  root: data/
  classes: [No_Fire, Smoke, Fire, Fire_Smoke]
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

training:
  epochs: 100
  batch_size: 32
  num_workers: 4
  seed: 42

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

scheduler:
  name: cosine
  min_lr: 0.000001
  warmup_epochs: 5

loss:
  name: focal_ce
  gamma: 2.0
  label_smoothing: 0.1

augmentation:
  train:
    random_horizontal_flip: 0.5
    random_vertical_flip: 0.3
    random_rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
    random_erasing: 0.1
  test_time_augmentation: true
  tta_transforms: 5

checkpointing:
  save_dir: checkpoints/
  save_best: true
  monitor: val_accuracy

logging:
  log_dir: logs/
  log_interval: 10
